name: eBay Auto-Publish

on:
  schedule:
    # Daily at 14:00 UTC (10:00 AM ET) — starts after developer approval window
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  publish-radios:
    runs-on: ubuntu-latest
    steps:
      - name: Publish radios to eBay
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set in GitHub repo secrets — skipping."
            exit 0
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://prince-george-transport.pages.dev/api/cron/ebay-publish")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "HTTP $http_code"
            exit 1
          fi
